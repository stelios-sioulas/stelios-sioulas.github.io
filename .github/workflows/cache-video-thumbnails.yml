name: Cache YouTube thumbnail images
on:
  pull_request:
    types: [synchronize, opened, reopened]
    paths:
      - .github/workflows/cache-video-thumbnails.yml
      - assets/js/embeds.js
      - assets/video-thumbnails/**
permissions:
  contents: write
jobs:
  thumbnails:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/youtube-video-thumbnails-20261012' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Fetch actual YouTube thumbnails for local privacy-safe display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          ids = ["tdMbeJyw7nE", "X38Jy5wYe_c", "Y_9stpMR6rs", "O6IHi-c-nlA"]
          directory = Path("assets/video-thumbnails")
          directory.mkdir(parents=True, exist_ok=True)
          for vid in ids:
              dest = directory / (vid + ".jpg")
              if dest.exists() and dest.stat().st_size > 2500:
                  continue
              for host in ["i.ytimg.com", "img.youtube.com"]:
                  try:
                      req = Request(f"https://{host}/vi/{vid}/hqdefault.jpg", headers={"User-Agent": "Mozilla/5.0"})
                      with urlopen(req, timeout=25) as response:
                          data = response.read()
                      assert 2500 < len(data) < 500000, f"Bad size {len(data)}"
                      assert data[:3] == bytes([255, 216, 255]) and data[-2:] == bytes([255, 217]), "Not a valid JPEG"
                      dest.write_bytes(data)
                      print(f"{vid}: {len(data)} bytes from {host}")
                      break
                  except Exception as ex:
                      print(f"{vid}: {host} unavailable: {ex}")
              else:
                  raise SystemExit(f"Thumbnail unavailable for {vid}")
          PY
      - name: Commit verified preview images to PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video-thumbnails/*.jpg
          if git diff --cached --quiet; then
            echo "All thumbnails already version-controlled"
          else
            git commit -m "Save locally hosted video preview thumbnails"
            git push origin "HEAD:fix/youtube-video-thumbnails-20261012"
          fi
