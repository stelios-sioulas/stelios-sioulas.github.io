name: Strengthen musician profile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  strengthen-profile:
    if: github.event.head_commit.message != 'Strengthen musician profile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update profile positioning and CTAs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = {
              'index.html': {
                  'hero_buttons': '<a class="btn" href="projects.html">Explore projects</a>\n        <a class="btn ghost" href="#media">Watch Stelios play</a>\n        <a class="btn ghost" href="#contact">Contact</a>',
                  'about_first': 'Stelios Sioulas is an Athens-based drummer with a long-running presence across metal, rock, tribute projects and the wider Greek live scene. After building years of musical experience and live collaborations in Thessaloniki, he has continued his work in Athens across bands, live projects and teaching.',
                  'media_intro': '<div class="profile-cta"><div><div class="meta">Live · Video · Collaboration</div><h3>Watch Stelios play</h3><p>Selected live, drum-focused and recorded performances. More live footage will be added as new projects and shows come in.</p></div><div class="profile-cta-actions"><a class="btn" href="#live">See live dates</a><a class="btn ghost" href="#contact">Collaborate</a></div></div>\n        ',
                  'contact_intro': '<p class="contact-lead">For live projects, new bands, session work, collaborations and drum lessons, get in touch with Stelios.</p>\n          <div class="availability"><span>Available for</span><strong>Live projects · New bands · Session work · Collaborations</strong></div>\n          ',
              },
              'index-el.html': {
                  'hero_buttons': '<a class="btn" href="projects-el.html">Δες τα projects</a>\n        <a class="btn ghost" href="#media">Δες τον Στέλιο να παίζει</a>\n        <a class="btn ghost" href="#contact">Επικοινωνία</a>',
                  'about_first': 'Ο Stelios Sioulas είναι ντράμερ με βάση την Αθήνα, με πολυετή παρουσία στη metal, rock και tribute σκηνή και ευρεία εμπειρία σε ελληνικά live projects. Έχοντας χτίσει σημαντική μουσική εμπειρία και live συνεργασίες στη Θεσσαλονίκη, συνεχίζει τη δραστηριότητά του στην Αθήνα μέσα από μπάντες, live projects και διδασκαλία.',
                  'media_intro': '<div class="profile-cta"><div><div class="meta">Live · Video · Συνεργασίες</div><h3>Δες τον Stelios να παίζει</h3><p>Επιλεγμένα live, drum-focused και ηχογραφημένα performances. Περισσότερο live υλικό θα προστίθεται καθώς εξελίσσονται τα νέα projects και οι εμφανίσεις.</p></div><div class="profile-cta-actions"><a class="btn" href="#live">Live εμφανίσεις</a><a class="btn ghost" href="#contact">Συνεργασία</a></div></div>\n        ',
                  'contact_intro': '<p class="contact-lead">Για live projects, νέες μπάντες, session δουλειές, συνεργασίες και μαθήματα drums, μπορείς να επικοινωνήσεις με τον Stelios.</p>\n          <div class="availability"><span>Διαθέσιμος για</span><strong>Live projects · Νέες μπάντες · Session work · Συνεργασίες</strong></div>\n          ',
              },
          }

          css = '''\n.profile-cta{\n  display:flex;align-items:center;justify-content:space-between;gap:28px;\n  margin:30px 0 22px;padding:24px 26px;\n  background:linear-gradient(145deg,rgba(21,31,44,.96),rgba(9,15,24,.96));\n  border:1px solid var(--line);\n  box-shadow:0 12px 28px rgba(0,0,0,.18);\n}\n.profile-cta .meta{color:var(--accent2);font-size:12px;text-transform:uppercase;letter-spacing:.1em;margin-bottom:7px}\n.profile-cta h3{font-size:28px;line-height:1.05;margin-bottom:8px}\n.profile-cta p{margin:0;font-size:14px;max-width:650px}\n.profile-cta-actions{display:flex;gap:10px;flex-wrap:wrap;flex:0 0 auto}\n.profile-cta-actions .btn{white-space:nowrap}\n.contact-lead{font-size:17px!important;margin:0 0 18px!important;color:var(--text)!important}\n.availability{display:flex;flex-direction:column;gap:5px;margin:0 0 24px;padding:16px 18px;border-left:3px solid var(--accent);background:rgba(16,23,34,.72)}\n.availability span{color:var(--accent2);font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.1em;font-size:12px}\n.availability strong{font-family:Oswald,sans-serif;font-size:18px;line-height:1.35}\n@media(max-width:800px){\n  .profile-cta{flex-direction:column;align-items:flex-start;padding:22px}\n  .profile-cta-actions{width:100%}\n  .profile-cta-actions .btn{flex:1;text-align:center}\n}\n'''

          for name, cfg in files.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')
              if '<!-- ATHENS-MUSICIAN-PROFILE-V1 -->' in s:
                  continue

              # Stronger hero calls to action.
              s = re.sub(r'<div class="hero-actions">[\\s\\S]*?</div>', '<div class="hero-actions">' + cfg['hero_buttons'] + '\n      </div>', s, count=1)

              # Correct the current-location positioning in the first About paragraph.
              s = re.sub(r'(<section[^>]*id="about"[\\s\\S]*?<h2[^>]*>.*?</h2>\\s*)<p>.*?</p>', r'\\1<p>' + cfg['about_first'] + '</p>', s, count=1)

              # Add a prominent proof-of-playing / collaboration CTA before the embedded social media.
              marker = '<article class="instagram-feature"'
              if marker in s:
                  s = s.replace(marker, cfg['media_intro'] + marker, 1)

              # Add a clear professional availability statement to Contact.
              marker = '<div class="contact-box">'
              if marker in s:
                  s = s.replace(marker, cfg['contact_intro'] + marker, 1)

              # Add scoped CSS once.
              s = s.replace('</style>', css + '</style>', 1)
              s = s.replace('<body>', '<body>\n<!-- ATHENS-MUSICIAN-PROFILE-V1 -->', 1)
              p.write_text(s, encoding='utf-8')

          # Add the Greek teaching page to the sitemap.
          sm = Path('sitemap.xml')
          s = sm.read_text(encoding='utf-8')
          if 'https://steliossioulas.gr/teaching-el.html' not in s:
              s = s.replace('  <url><loc>https://steliossioulas.gr/teaching.html</loc></url>', '  <url><loc>https://steliossioulas.gr/teaching.html</loc></url>\n  <url><loc>https://steliossioulas.gr/teaching-el.html</loc></url>')
              sm.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-el.html sitemap.xml
          git diff --cached --quiet || git commit -m "Strengthen musician profile"
          git push
