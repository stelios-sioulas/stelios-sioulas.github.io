name: Fix musician profile copy

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-copy:
    if: github.event.head_commit.message != 'Fix musician profile copy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix hero and About positioning
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'index.html': [
                  ('<a class="btn" href="projects.html">Explore projects</a>\n        <a class="btn ghost" href="#contact">Contact</a>', '<a class="btn" href="projects.html">Explore projects</a>\n        <a class="btn ghost" href="#media">Watch Stelios play</a>\n        <a class="btn ghost" href="#contact">Contact</a>'),
                  ('Stelios Sioulas is a drummer from Thessaloniki, Greece, with a career spanning original bands, tribute acts, studio recordings and live collaborations.', 'Stelios Sioulas is an Athens-based drummer with a long-running presence across metal, rock, tribute projects and the wider Greek live scene. After building years of musical experience and live collaborations in Thessaloniki, he has continued his work in Athens across bands, live projects and teaching.'),
              ],
              'index-el.html': [
                  ('<a class="btn" href="projects-el.html">Δες τα projects</a>\n        <a class="btn ghost" href="#contact">Επικοινωνία</a>', '<a class="btn" href="projects-el.html">Δες τα projects</a>\n        <a class="btn ghost" href="#media">Δες τον Στέλιο να παίζει</a>\n        <a class="btn ghost" href="#contact">Επικοινωνία</a>'),
                  ('Ο Stelios Sioulas είναι ντράμερ από τη Θεσσαλονίκη και ζει στην Αθήνα. Η πορεία του περιλαμβάνει original μπάντες, tribute σχήματα, studio ηχογραφήσεις και live συνεργασίες.', 'Ο Stelios Sioulas είναι ντράμερ με βάση την Αθήνα, με πολυετή παρουσία στη metal, rock και tribute σκηνή και ευρεία εμπειρία σε ελληνικά live projects. Έχοντας χτίσει σημαντική μουσική εμπειρία και live συνεργασίες στη Θεσσαλονίκη, συνεχίζει τη δραστηριότητά του στην Αθήνα μέσα από μπάντες, live projects και διδασκαλία.'),
              ],
          }

          for name, reps in replacements.items():
              p=Path(name); s=p.read_text(encoding='utf-8')
              for old,new in reps:
                  s=s.replace(old,new,1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-el.html
          git diff --cached --quiet || git commit -m "Fix musician profile copy"
          git push
