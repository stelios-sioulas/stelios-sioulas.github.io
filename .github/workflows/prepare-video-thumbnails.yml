name: Prepare local YouTube thumbnails (temporary)

on:
  push:
    branches:
      - fix/youtube-video-thumbnails-20261012
    paths:
      - .github/workflows/prepare-video-thumbnails.yml

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and verify public thumbnails
        run: |
          python3 - <<'PY'
          from urllib.request import Request, urlopen
          from pathlib import Path
          ids = ['tdMbeJyw7nE', 'X38Jy5wYe_c', 'Y_9stpMR6rs', 'O6IHi-c-nlA']
          folder = Path('assets/video-thumbnails')
          folder.mkdir(parents=True, exist_ok=True)
          for video_id in ids:
              data = None
              for host in ['i.ytimg.com', 'img.youtube.com']:
                  try:
                      req = Request(f'https://{host}/vi/{video_id}/hqdefault.jpg', headers={'User-Agent': 'Mozilla/5.0'})
                      with urlopen(req, timeout=25) as response:
                          candidate = response.read()
                      if len(candidate) > 1500 and candidate[:3] == b'\\xff\\xd8\\xff' and candidate[-2:] == b'\\xff\\xd9':
                          data = candidate
                          break
                  except Exception as ex:
                      print(f'{video_id}: {host}: {ex}')
              if data is None:
                  raise SystemExit(f'Could not download verified thumbnail: {video_id}')
              dest = folder / f'{video_id}.jpg'
              dest.write_bytes(data)
              print(f'{dest}: {len(data)} bytes')
          PY
      - name: Commit local thumbnails to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/video-thumbnails/*.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Add self-hosted YouTube preview thumbnails"
          git push origin HEAD:fix/youtube-video-thumbnails-20261012
