name: Link teaching page

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-teaching-links:
    if: github.event.head_commit.message != 'Link Teaching page from home'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Teaching page links
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          files = {
              'index.html': ('Teaching', 'teaching.html', 'View teaching'),
              'index-el.html': ('Διδασκαλία', 'teaching-el.html', 'Δες τη διδασκαλία'),
          }

          for name, (label, target, button_text) in files.items():
              p = Path(name)
              s = p.read_text(encoding='utf-8')

              # Link the main navigation item to the standalone Teaching page.
              s = re.sub(
                  rf'<a href="#teaching">{re.escape(label)}</a>',
                  f'<a href="{target}">{label}</a>',
                  s,
                  count=1,
              )

              # Add a clear button inside the Teaching section if it is not already there.
              if f'href="{target}"' not in s:
                  m = re.search(r'(<section[^>]*id=["\']teaching["\'][\s\S]*?</section>)', s)
                  if not m:
                      raise SystemExit(f'Teaching section not found in {name}')
                  section = m.group(1)
                  button = f'\n        <div class="project-actions"><a class="btn ghost" href="{target}">{button_text}</a></div>\n      '
                  section = section.replace('</section>', button + '</section>', 1)
                  s = s[:m.start()] + section + s[m.end():]

              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html index-el.html
          git diff --cached --quiet || git commit -m "Link Teaching page from home"
          git push
