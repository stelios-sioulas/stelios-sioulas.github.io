media:
  input: assets
  output: /assets

content:
  - name: live
    label: LIVE
    type: file
    path: data/live.json
    format: json
    fields:
      - name: section
        label: Κείμενα ενότητας
        type: object
        required: true
        fields:
          - name: label
            label: Αρίθμηση / ετικέτα ενότητας
            type: string
            required: true
          - name: title_en
            label: Τίτλος desktop (EN)
            type: string
            required: true
          - name: title_el
            label: Τίτλος desktop (EL)
            type: string
            required: true
          - name: intro_en
            label: Εισαγωγή desktop (EN)
            type: text
            required: false
          - name: intro_el
            label: Εισαγωγή desktop (EL)
            type: text
            required: false
          - name: mobile_title_en
            label: Τίτλος mobile (EN)
            type: string
            required: true
          - name: mobile_title_el
            label: Τίτλος mobile (EL)
            type: string
            required: true

      - name: events
        label: Live εμφανίσεις
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title} — {day} {date_el}"
        fields:
          - name: day
            label: Ημέρα
            type: string
            required: true
          - name: date_en
            label: Μήνας και έτος (EN)
            type: string
            required: true
          - name: date_el
            label: Μήνας και έτος (EL)
            type: string
            required: true
          - name: venue_en
            label: Χώρος και πόλη (EN)
            type: string
            required: false
          - name: venue_el
            label: Χώρος και πόλη (EL)
            type: string
            required: false
          - name: title
            label: Όνομα μπάντας / εμφάνισης
            type: string
            required: true
          - name: description_en
            label: Περιγραφή desktop (EN)
            type: text
            required: false
          - name: description_el
            label: Περιγραφή desktop (EL)
            type: text
            required: false
          - name: role_en
            label: Ρόλος Stelios desktop (EN)
            type: text
            required: false
          - name: role_el
            label: Ρόλος Stelios desktop (EL)
            type: text
            required: false
          - name: mobile_title_en
            label: Τίτλος mobile (EN)
            type: string
            required: false
          - name: mobile_title_el
            label: Τίτλος mobile (EL)
            type: string
            required: false
          - name: mobile_description_en
            label: Περιγραφή mobile (EN)
            type: text
            required: false
          - name: mobile_description_el
            label: Περιγραφή mobile (EL)
            type: text
            required: false
          - name: url
            label: Σύνδεσμος εκδήλωσης
            type: string
            required: false
          - name: aria_label_en
            label: Προσβάσιμη περιγραφή συνδέσμου (EN)
            type: string
            required: false
          - name: aria_label_el
            label: Προσβάσιμη περιγραφή συνδέσμου (EL)
            type: string
            required: false

      - name: highlight_en
        label: Ιστορικό / highlight desktop (EN)
        type: text
        required: false
      - name: highlight_el
        label: Ιστορικό / highlight desktop (EL)
        type: text
        required: false

  - name: projects
    label: PROJECTS
    type: file
    path: data/projects.json
    format: json
    fields:
      - name: home
        label: Κείμενα Projects στην αρχική
        type: object
        required: true
        fields:
          - name: label
            label: Αρίθμηση / ετικέτα ενότητας
            type: string
            required: true
          - name: title_en
            label: Τίτλος desktop (EN)
            type: string
            required: true
          - name: title_el
            label: Τίτλος desktop (EL)
            type: string
            required: true
          - name: mobile_title_en
            label: Τίτλος mobile (EN)
            type: string
            required: true
          - name: mobile_title_el
            label: Τίτλος mobile (EL)
            type: string
            required: true
          - name: intro_en
            label: Εισαγωγή desktop (EN)
            type: text
            required: false
          - name: intro_el
            label: Εισαγωγή desktop (EL)
            type: text
            required: false
          - name: button_en
            label: Κουμπί προς όλα τα projects (EN)
            type: string
            required: true
          - name: button_el
            label: Κουμπί προς όλα τα projects (EL)
            type: string
            required: true

      - name: page
        label: Κείμενα πλήρους σελίδας Projects
        type: object
        required: true
        fields:
          - name: eyebrow_en
            label: Μικρός τίτλος hero (EN)
            type: string
            required: false
          - name: eyebrow_el
            label: Μικρός τίτλος hero (EL)
            type: string
            required: false
          - name: title
            label: Κύριος τίτλος
            type: string
            required: true
          - name: intro_en
            label: Εισαγωγή (EN)
            type: text
            required: false
          - name: intro_el
            label: Εισαγωγή (EL)
            type: text
            required: false
          - name: current_heading_en
            label: Τίτλος ενεργών projects (EN)
            type: string
            required: true
          - name: current_heading_el
            label: Τίτλος ενεργών projects (EL)
            type: string
            required: true
          - name: past_heading_en
            label: Τίτλος παλαιότερων projects (EN)
            type: string
            required: true
          - name: past_heading_el
            label: Τίτλος παλαιότερων projects (EL)
            type: string
            required: true

      - name: projects
        label: Λίστα projects
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} — {group}"
        fields:
          - name: group
            label: Κατηγορία
            type: select
            required: true
            options:
              values:
                - name: current
                  label: Τρέχον / ενεργό
                - name: past
                  label: Παλαιότερο / συνεργασία
          - name: show_on_mobile
            label: Εμφάνιση στην επιλεγμένη mobile λίστα
            type: boolean
            required: false
          - name: name
            label: Όνομα project
            type: string
            required: true
          - name: meta_en
            label: Είδος / μικρή περιγραφή (EN)
            type: string
            required: false
          - name: meta_el
            label: Είδος / μικρή περιγραφή (EL)
            type: string
            required: false
          - name: description_en
            label: Περιγραφή (EN)
            type: text
            required: false
          - name: description_el
            label: Περιγραφή (EL)
            type: text
            required: false
          - name: home_description_en
            label: Διαφορετική περιγραφή αρχικής (EN)
            type: text
            required: false
            description: Συμπλήρωσέ το μόνο αν η αρχική χρειάζεται διαφορετικό κείμενο.
          - name: home_description_el
            label: Διαφορετική περιγραφή αρχικής (EL)
            type: text
            required: false
          - name: page_description_en
            label: Διαφορετική περιγραφή πλήρους σελίδας (EN)
            type: text
            required: false
            description: Συμπλήρωσέ το μόνο αν η πλήρης σελίδα χρειάζεται διαφορετικό κείμενο.
          - name: page_description_el
            label: Διαφορετική περιγραφή πλήρους σελίδας (EL)
            type: text
            required: false
          - name: italic_text
            label: Τμήμα περιγραφής σε πλάγια γραφή
            type: string
            required: false
          - name: url
            label: Δημόσιο προφίλ / website
            type: string
            required: false

