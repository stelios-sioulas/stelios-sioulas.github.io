<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Stelios Sioulas S drumstick emblem">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123f6e"/>
      <stop offset="1" stop-color="#071a2d"/>
    </linearGradient>
  </defs>

  <!-- Inverted dark-blue shield -->
  <path d="M30 38 H226 L128 230 Z" fill="url(#shield)"/>

  <!-- Three drumsticks forming the shield edges -->
  <g fill="none" stroke="#65a7e3" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 46 H214"/>
    <path d="M43 48 L128 218"/>
    <path d="M213 48 L128 218"/>
  </g>

  <!-- Drumstick tips -->
  <g fill="#d9efff">
    <ellipse cx="42" cy="46" rx="13" ry="9"/>
    <ellipse cx="128" cy="218" rx="9" ry="13"/>
    <ellipse cx="213" cy="48" rx="9" ry="13" transform="rotate(-27 213 48)"/>
  </g>

  <!-- Inner shield edge -->
  <path d="M54 58 H202 L128 204 Z" fill="none" stroke="#2d6598" stroke-width="3" opacity=".85"/>

  <!-- Single stylized S -->
  <path d="M162 88
           C151 73 135 68 119 70
           C101 72 91 83 92 98
           C93 114 109 120 128 124
           C148 128 161 136 160 151
           C159 169 145 180 126 181
           C109 182 95 176 86 165"
        fill="none"
        stroke="#ffffff"
        stroke-width="22"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>